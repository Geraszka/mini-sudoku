<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f6b">
<title>Mini Sudoku</title>
<style>
:root{--bg:#e8eef0;--panel:#fff;--ink:#18323a;--given:#18323a;--mine:#1f7a8c;--line:#9db4ba;--block:#18323a;--sel:#ffd45e;--bad:#e5484d;--badbg:#fde4e4;--accent:#1f5f6b;--accent-ink:#fff;--peer:#c4dde3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c20;--panel:#172a30;--ink:#e3eef0;--given:#e3eef0;--mine:#6fd0e2;--line:#3b565e;--block:#9fc3cb;--sel:#8a7220;--bad:#ff7b80;--badbg:#4a2326;--accent:#6fd0e2;--accent-ink:#0f1c20;--peer:#2c5360}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;display:flex;justify-content:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
main{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;padding:20px 0;justify-content:center}
h1{margin:0;font-size:1.4rem;flex:1}
.top,.sub{display:flex;align-items:center;gap:8px}
button{font:inherit;color:var(--ink);cursor:pointer}
.ib,#setBtn{font-size:1.2rem;padding:8px 12px;border-radius:10px;border:2px solid var(--accent);background:var(--panel)}
#setBtn{flex:1;text-align:left;letter-spacing:.1em}
.msg{min-height:1.4em;margin:0}
.msg.ok{color:var(--mine);font-weight:700}
.reward{font-size:2rem;vertical-align:middle}
#board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));background:var(--panel);border:3px solid var(--block);border-radius:10px;overflow:hidden;aspect-ratio:1}
.cell{border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:clamp(1.8rem,10vw,2.6rem);font-weight:700;background:transparent;color:var(--mine);padding:0;border-radius:0;min-width:0;min-height:0;overflow:hidden}
.cell.emoji{font-weight:400}
.cell.given{color:var(--given);cursor:default}
.cell.r1{border-bottom:3px solid var(--block)}
.cell.c1{border-right:3px solid var(--block)}
.cell.peer{background:var(--peer)}
.cell.sel{background:var(--sel)}
.cell.bad{background:var(--badbg);color:var(--bad)}
.notes{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;width:100%;height:100%;place-items:center;font-size:clamp(.85rem,4.4vw,1.15rem);font-weight:400;opacity:.5;line-height:1}
#pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
#pad.notemode button{border-style:dashed;opacity:.8}
#pad button,#notebtn{font-size:1.3rem;font-weight:700;padding:14px 0;border-radius:10px;border:2px solid var(--accent);background:var(--panel)}
#pad button:active{background:var(--accent);color:var(--accent-ink)}
#notebtn{width:100%;font-size:1rem;padding:12px 0}
#notebtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sel);outline-offset:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal[hidden]{display:none}
.mbox{background:var(--panel);color:var(--ink);border-radius:12px;padding:14px;width:100%;max-width:440px;max-height:100%;overflow:auto}
.mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.mclose{padding:6px 12px;border-radius:10px;border:2px solid var(--accent);background:var(--panel);font-weight:700}
.optlist{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:1rem;text-align:left;width:100%}
.opt.on{border-color:var(--accent);background:var(--peer);box-shadow:0 0 0 2px var(--accent)}
.opt .fl{font-size:1.8rem}.opt .nm{font-weight:700}
.opt .syms{display:flex;gap:10px;font-size:1.6rem;margin-left:auto}
.hint{margin:12px 0 0;font-size:.9rem}
.slots{display:flex;gap:8px;margin-top:8px}
.slots button{flex:1;font-size:1.6rem;padding:8px 0;border-radius:10px;border:2px solid var(--line);background:var(--bg)}
.slots button.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent)}
.palette{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:8px}
.palette button{font-size:1.2rem;padding:4px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg)}
.palette button.used{border:2px solid var(--accent);background:var(--peer)}
.confbtns{display:flex;gap:8px}
.confbtns button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:12px;border:2px solid var(--accent);background:var(--panel);font-size:.85rem;font-weight:700}
.confbtns .ic{font-size:1.8rem}
#collgrid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px}
.ci{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(.9rem,4.6vw,1.5rem);border-radius:6px;background:var(--bg)}
.ci.q{color:var(--line);font-weight:700}
.codebox{margin-top:14px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.coderow{display:flex;gap:6px}
.codebox input{flex:1;min-width:0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1rem;padding:8px;border-radius:8px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.codebox button{font-size:.95rem;font-weight:700;padding:8px 12px;border-radius:10px;border:2px solid var(--accent);background:var(--panel)}
#codemsg{margin:0;min-height:1.3em}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1 data-i18n="title"></h1>
    <button id="langBtn" class="ib"></button>
    <button id="collBtn" class="ib">🏆 0/100</button>
  </div>
  <div class="sub">
    <button id="setBtn"></button>
    <button id="newBtn" class="ib">🎲</button>
  </div>
  <p class="msg" id="msg" aria-live="polite"></p>
  <div id="board" role="grid"></div>
  <div id="pad"></div>
  <button id="notebtn" aria-pressed="false"></button>
</main>

<div class="modal" id="mlang" hidden role="dialog" aria-modal="true"><div class="mbox">
  <div class="mhead"><strong data-i18n="language"></strong><button class="mclose">✕</button></div>
  <div id="langlist" class="optlist"></div>
</div></div>

<div class="modal" id="mset" hidden role="dialog" aria-modal="true"><div class="mbox">
  <div class="mhead"><strong data-i18n="symbols"></strong><button class="mclose">✕</button></div>
  <div id="setlist" class="optlist"></div>
</div></div>

<div class="modal" id="mconf" hidden role="dialog" aria-modal="true"><div class="mbox">
  <div class="mhead"><strong data-i18n="confirmTitle"></strong></div>
  <div class="confbtns">
    <button id="cRestart"><span class="ic">↩️</span><span data-i18n="restart"></span></button>
    <button id="cNew"><span class="ic">🎲</span><span data-i18n="newPuzzle"></span></button>
    <button id="cCancel"><span class="ic">✖️</span><span data-i18n="cancel"></span></button>
  </div>
</div></div>

<div class="modal" id="mcoll" hidden role="dialog" aria-modal="true"><div class="mbox">
  <div class="mhead"><strong id="collcount"></strong><button class="mclose">✕</button></div>
  <div id="collgrid"></div>
  <div class="codebox">
    <label for="codeout" data-i18n="codeLabel"></label>
    <div class="coderow"><input id="codeout" readonly><button id="codecopy" data-i18n="copy"></button></div>
    <label for="codein" data-i18n="loadLabel"></label>
    <div class="coderow"><input id="codein" placeholder="XXXXXXX-XXXXXXX-XXXXXXX" autocapitalize="characters" autocomplete="off" spellcheck="false"><button id="codeload" data-i18n="load"></button></div>
    <p id="codemsg" aria-live="polite"></p>
  </div>
</div></div>

<script src="lang.js"></script>
<script>
(function(){
if(!window.LANGS||!Object.keys(window.LANGS).length){document.body.innerHTML='<p style="padding:24px;font-family:sans-serif">lang.js not found. Upload lang.js next to index.html.</p>';return;}
var N=4,B=2;
// Matricák. A sorrend ne változzon: a mentési kódok ehhez kötődnek.
var STK=['🐶','🐱','🐭','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐗','🐵','🐴','🐺','🦓','🦍','🐘','🦛','🦏','🐫','🦒','🦘','🐑','🦙','🦌','🦔','🦇','🦝','🦨','🦦','🦥','🐿️',
 '🐔','🐧','🐦','🐤','🦆','🦅','🦉','🦚','🦜','🦢','🦩','🦃',
 '🐢','🐍','🦎','🐊','🦖','🦕','🐸',
 '🐙','🦐','🦀','🐠','🦈','🐬','🐳','🦭',
 '🐝','🐛','🦋','🐌','🐞','🐜','🦗','🦂','🕷️',
 '🍎','🍌','🍇','🍓','🍉','🍍','🍒','🥕','🌽','🍄','🌻','🌵','🌈','☀️','🌙','⭐','❄️','🔥','🚀','🚂','⛵','🚁','🚜','🚲','🚒','🎈','🎁','🏰','🎸','🎨'];
var PAL=['🐶','🐱','🐸','🐘','🦁','🐵','🐼','🐧','🐢','🦋',
 '🐴','🐮','🐷','🐑','🐰','🐔','🦊','🐻','🦒','🦓',
 '🍎','🍌','🍇','🍓','🍊','🍉','🍍','🍒','🍐','🥝',
 '🚗','🚲','✈️','🚀','🚂','⛵','🚁','🚌','🚜','🚒',
 '🔴','🟦','🟢','⭐','🔶','🟣','❤️','🔺','🟡','⬛'];
var SETS=[{id:'animals',sym:['🐶','🐱','🐸','🐘']},{id:'fruits',sym:['🍎','🍌','🍇','🍓']},{id:'vehicles',sym:['🚗','🚲','✈️','🚀']},
 {id:'shapes',sym:['🔴','🟦','🟢','⭐']},{id:'num',sym:['1','2','3','4']},{id:'custom'}];
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
var $=function(id){return document.getElementById(id);};

// --- Nyelv: mentett választás, különben az eszköz nyelve, különben angol ---
var LANGS=window.LANGS,LORDER=Object.keys(LANGS),lang=lsGet('sudokuLang');
if(!LANGS[lang]){
  lang='en';
  var pl=navigator.languages&&navigator.languages.length?navigator.languages:[navigator.language||'en'];
  for(var li=0;li<pl.length;li++){var lc=String(pl[li]).slice(0,2).toLowerCase();if(LANGS[lc]){lang=lc;break;}}
  if(!LANGS[lang])lang=LORDER[0];
}
function t(k,p){var s=(LANGS[lang]&&LANGS[lang][k])||(LANGS.en&&LANGS.en[k])||k;if(p)for(var x in p)s=s.replace('{'+x+'}',p[x]);return s;}

// --- Jelkészlet ---
var setId=lsGet('sudokuSet2'),customSlot=0,customSyms=['🐶','🍎','🚗','⭐'];
if(!SETS.some(function(x){return x.id===setId;}))setId='animals';
try{var cs=JSON.parse(lsGet('sudokuCustom'));if(Array.isArray(cs)&&cs.length===4)customSyms=cs;}catch(e){}
function curSyms(){return setId==='custom'?customSyms:SETS.filter(function(x){return x.id===setId;})[0].sym;}
function sym(v){return curSyms()[v-1];}
function isEmoji(){return setId!=='num';}

var grid=[],given=[],notes=[],puzzle=[],noteMode=false,sel=-1,solved=false,rewarded=false;
var collected=STK.map(function(){return 0;});
var boardEl=$('board'),msgEl=$('msg'),pad=$('pad'),noteBtn=$('notebtn'),collBtn=$('collBtn');

// --- Felugró ablakok ---
var MODALS=['mlang','mset','mconf','mcoll'];
function openM(id){closeM();$(id).hidden=false;}
function closeM(){MODALS.forEach(function(id){$(id).hidden=true;});}
function anyOpen(){return MODALS.some(function(id){return !$(id).hidden;});}
MODALS.forEach(function(id){$(id).addEventListener('click',function(e){if(e.target===$(id))closeM();});});
Array.prototype.forEach.call(document.querySelectorAll('.mclose'),function(b){b.addEventListener('click',closeM);});

// --- Feladvány ---
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x;}return a;}
function makeSolution(){
  var base=[[1,2,3,4],[3,4,1,2],[2,1,4,3],[4,3,2,1]],dg=shuffle([1,2,3,4]);
  var r0=shuffle([0,1]),r1=shuffle([0,1]),c0=shuffle([0,1]),c1=shuffle([0,1]);
  var ro=[r0[0]*2+r1[0],r0[0]*2+(1-r1[0]),r0[1]*2+r1[1],r0[1]*2+(1-r1[1])];
  var co=[c0[0]*2+c1[0],c0[0]*2+(1-c1[0]),c0[1]*2+c1[1],c0[1]*2+(1-c1[1])],g=[];
  for(var r=0;r<N;r++)for(var c=0;c<N;c++)g.push(dg[base[ro[r]][co[c]]-1]);
  return g;
}
function candidates(g,i){
  var r=Math.floor(i/N),c=i%N,u={};
  for(var k=0;k<N;k++){u[g[r*N+k]]=1;u[g[k*N+c]]=1;}
  var br=r-r%B,bc=c-c%B;
  for(var y=0;y<B;y++)for(var x=0;x<B;x++)u[g[(br+y)*N+bc+x]]=1;
  var res=[];for(var d=1;d<=N;d++)if(!u[d])res.push(d);return res;
}
function countSolutions(g,limit){
  var idx=-1;for(var i=0;i<g.length;i++)if(!g[i]){idx=i;break;}
  if(idx<0)return 1;
  var n=0,cs=candidates(g,idx);
  for(var k=0;k<cs.length&&n<limit;k++){g[idx]=cs[k];n+=countSolutions(g,limit-n);g[idx]=0;}
  return n;
}
function makePuzzle(){
  var p=makeSolution(),order=shuffle(p.map(function(_,i){return i;})),removed=0,target=9+Math.floor(Math.random()*2);
  for(var k=0;k<order.length&&removed<target;k++){
    var i=order[k],v=p[i];p[i]=0;
    if(countSolutions(p.slice(),2)===1)removed++;else p[i]=v;
  }
  return p;
}
function conflicts(){
  var bad={};
  function scan(cells){
    var seen={};
    cells.forEach(function(i){var v=grid[i];if(!v)return;(seen[v]=seen[v]||[]).push(i);});
    for(var v in seen)if(seen[v].length>1)seen[v].forEach(function(i){bad[i]=1;});
  }
  for(var a=0;a<N;a++){var row=[],col=[];for(var b=0;b<N;b++){row.push(a*N+b);col.push(b*N+a);}scan(row);scan(col);}
  for(var br=0;br<N;br+=B)for(var bc=0;bc<N;bc+=B){var blk=[];for(var y=0;y<B;y++)for(var x=0;x<B;x++)blk.push((br+y)*N+bc+x);scan(blk);}
  return bad;
}
function say(x,ok){msgEl.textContent=x;msgEl.className='msg'+(ok?' ok':'');}
function render(){
  var bad=conflicts(),pr=-1,pc=-1;
  if(sel>=0){pr=Math.floor(sel/N);pc=sel%N;}
  boardEl.setAttribute('aria-label',t('boardAria'));
  boardEl.innerHTML='';
  for(var i=0;i<N*N;i++)(function(i){
    var r=Math.floor(i/N),c=i%N,b=document.createElement('button');
    var peer=sel>=0&&i!==sel&&(r===pr||c===pc||(r-r%B===pr-pr%B&&c-c%B===pc-pc%B));
    b.className='cell'+(isEmoji()?' emoji':'')+(given[i]?' given':'')+(peer?' peer':'')+(i===sel?' sel':'')+(bad[i]?' bad':'')+(r===1?' r1':'')+(c===1?' c1':'');
    var lab=t('cellAria',{r:r+1,c:c+1})+', ';
    if(grid[i]){b.textContent=sym(grid[i]);lab+=t('value')+' '+sym(grid[i]);}
    else if(notes[i]&&notes[i].some(function(x){return x;})){
      var nb=document.createElement('div');nb.className='notes';
      for(var k=0;k<N;k++){var sp=document.createElement('span');sp.textContent=notes[i][k]?sym(k+1):'';nb.appendChild(sp);}
      b.appendChild(nb);lab+=t('notes')+': '+notes[i].map(function(x,k){return x?sym(k+1):'';}).join(' ');
    }else lab+=t('empty');
    b.setAttribute('aria-label',lab);
    b.addEventListener('click',function(){if(solved)return;sel=i;render();});
    boardEl.appendChild(b);
  })(i);
}
function isWon(){for(var i=0;i<grid.length;i++)if(!grid[i])return false;return Object.keys(conflicts()).length===0;}
function dirty(){
  if(solved)return false;
  return grid.some(function(v,i){return v&&!given[i];})||notes.some(function(n){return n.some(function(x){return x;});});
}
function place(v){
  if(solved||sel<0||given[sel]){say(t('pickEmpty'));return;}
  if(noteMode){
    if(grid[sel]){say(t('noteFilled'));return;}
    if(v===0)notes[sel]=[0,0,0,0];else notes[sel][v-1]=notes[sel][v-1]?0:1;
    render();say('');return;
  }
  grid[sel]=v;notes[sel]=[0,0,0,0];render();
  if(isWon())win();else say('');
}
function win(){
  solved=true;sel=-1;render();
  if(rewarded){say(t('win')+' '+t('winAlready'),true);return;}
  rewarded=true;
  var free=[];for(var i=0;i<collected.length;i++)if(!collected[i])free.push(i);
  if(!free.length){say(t('win')+' '+t('winAll',{max:STK.length}),true);return;}
  var pick=free[Math.floor(Math.random()*free.length)];
  collected[pick]=1;saveCol();updateCollBtn();
  say(t('win')+' '+t('reward')+' ',true);
  var big=document.createElement('span');big.className='reward';big.textContent=STK[pick];msgEl.appendChild(big);
}
function start(p,isNew){
  if(isNew)rewarded=false;
  puzzle=p;grid=p.slice();notes=p.map(function(){return [0,0,0,0];});given=p.map(function(v){return v>0;});sel=-1;solved=false;
  render();say(t('intro'));
}

// --- Felület ---
function buildPad(){
  pad.innerHTML='';
  for(var d=1;d<=N;d++)(function(d){
    var b=document.createElement('button');b.textContent=sym(d);b.setAttribute('aria-label',t('symAria')+': '+sym(d));
    b.addEventListener('click',function(){place(d);});pad.appendChild(b);
  })(d);
  var er=document.createElement('button');er.textContent='⌫';er.setAttribute('aria-label',t('erase'));
  er.addEventListener('click',function(){place(0);});pad.appendChild(er);
}
function updateSetBtn(){$('setBtn').textContent=curSyms().join(' ');$('setBtn').setAttribute('aria-label',t('symbols'));}
function refreshSyms(){buildSetList();buildPad();updateSetBtn();render();}
function mk(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e;}
function buildSetList(){
  var list=$('setlist');list.innerHTML='';
  SETS.forEach(function(x){
    var b=mk('button','opt'+(x.id===setId?' on':''));
    b.appendChild(mk('span','nm',t('set_'+x.id)));
    b.appendChild(mk('span','syms',(x.id==='custom'?customSyms:x.sym).map(function(s){return s;}).join(' ')));
    b.addEventListener('click',function(){setId=x.id;lsSet('sudokuSet2',setId);refreshSyms();});
    list.appendChild(b);
  });
  if(setId!=='custom')return;
  list.appendChild(mk('p','hint',t('customHint')));
  var slots=mk('div','slots');
  customSyms.forEach(function(e,i){
    var b=mk('button',i===customSlot?'on':'',e);
    b.addEventListener('click',function(){customSlot=i;buildSetList();});
    slots.appendChild(b);
  });
  list.appendChild(slots);
  var pal=mk('div','palette');
  PAL.forEach(function(e){
    var b=mk('button',customSyms.indexOf(e)>=0?'used':'',e);
    b.addEventListener('click',function(){
      var j=customSyms.indexOf(e);
      if(j>=0&&j!==customSlot)customSyms[j]=customSyms[customSlot];
      customSyms[customSlot]=e;lsSet('sudokuCustom',JSON.stringify(customSyms));
      customSlot=(customSlot+1)%4;refreshSyms();
    });
    pal.appendChild(b);
  });
  list.appendChild(pal);
}
function buildLangList(){
  var list=$('langlist');list.innerHTML='';
  LORDER.forEach(function(k){
    var b=mk('button','opt'+(k===lang?' on':''));
    b.appendChild(mk('span','fl',LANGS[k].flag));b.appendChild(mk('span','nm',LANGS[k].name));
    b.addEventListener('click',function(){
      lang=k;lsSet('sudokuLang',lang);applyLang();closeM();say(solved?t('win'):t('intro'),solved);
    });
    list.appendChild(b);
  });
}
function updateNoteBtn(){noteBtn.textContent=t(noteMode?'noteOn':'noteOff');noteBtn.setAttribute('aria-pressed',noteMode);pad.classList.toggle('notemode',noteMode);}
function applyLang(){
  document.documentElement.lang=lang;document.title=t('title');
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'),function(el){el.textContent=t(el.getAttribute('data-i18n'));});
  $('langBtn').textContent=LANGS[lang].flag;$('langBtn').setAttribute('aria-label',t('language'));
  $('newBtn').setAttribute('aria-label',t('newAria'));collBtn.setAttribute('aria-label',t('collOpen'));
  buildLangList();buildSetList();buildPad();updateSetBtn();updateNoteBtn();updateCollBtn();render();
}

// --- Gyűjtemény és mentési kód (20 karakter + 1 ellenőrző karakter) ---
var W=[1,5,7,11,13,17,19,23,25,29,31,35];
function chk(s){var sum=0;for(var i=0;i<s.length;i++)sum+=W[i%12]*parseInt(s[i],36);return (sum%36).toString(36).toUpperCase();}
function countCol(){return collected.reduce(function(a,b){return a+b;},0);}
function updateCollBtn(){collBtn.textContent='🏆 '+countCol()+'/'+STK.length;}
function saveCol(){var l=[];collected.forEach(function(v,i){if(v)l.push(i);});lsSet('sudokuCollection2',JSON.stringify(l));}
function loadCol(){try{var l=JSON.parse(lsGet('sudokuCollection2')||'[]');if(Array.isArray(l))l.forEach(function(i){if(i>=0&&i<STK.length)collected[i]=1;});}catch(e){}}
function encodeCol(){
  var n=0n;collected.forEach(function(v,i){if(v)n|=(1n<<BigInt(i));});
  var s=n.toString(36).toUpperCase();while(s.length<20)s='0'+s;
  return (s+chk(s)).match(/.{7}/g).join('-');
}
function decodeCol(str){
  var s=str.toUpperCase().replace(/[^0-9A-Z]/g,'');
  if(s.length!==21||chk(s.slice(0,20))!==s[20])return null;
  var n=0n;for(var i=0;i<20;i++)n=n*36n+BigInt(parseInt(s[i],36));
  if(n>=(1n<<100n))return null;
  var res=[];for(var k=0;k<STK.length;k++)res.push(Number((n>>BigInt(k))&1n));
  return res;
}
function renderColl(){
  var g=$('collgrid');g.innerHTML='';
  STK.forEach(function(a,i){g.appendChild(mk('div','ci'+(collected[i]?'':' q'),collected[i]?a:'?'));});
  $('collcount').textContent=t('collTitle',{n:countCol(),max:STK.length});
  $('codeout').value=encodeCol();
}

// --- Események ---
$('langBtn').addEventListener('click',function(){buildLangList();openM('mlang');});
$('setBtn').addEventListener('click',function(){buildSetList();openM('mset');});
$('newBtn').addEventListener('click',function(){if(dirty())openM('mconf');else start(makePuzzle(),true);});
$('cRestart').addEventListener('click',function(){closeM();start(puzzle,false);});
$('cNew').addEventListener('click',function(){closeM();start(makePuzzle(),true);});
$('cCancel').addEventListener('click',closeM);
collBtn.addEventListener('click',function(){renderColl();$('codemsg').textContent='';$('codein').value='';openM('mcoll');});
noteBtn.addEventListener('click',function(){noteMode=!noteMode;updateNoteBtn();say(noteMode?t('noteMsg'):'');});
$('codecopy').addEventListener('click',function(){
  var o=$('codeout');o.select();var ok=false;
  try{if(navigator.clipboard){navigator.clipboard.writeText(o.value);ok=true;}}catch(e){}
  $('codemsg').textContent=t(ok?'copied':'copyManual');
});
$('codeload').addEventListener('click',function(){
  var res=decodeCol($('codein').value);
  if(!res){$('codemsg').textContent=t('codeBad');return;}
  var added=0;res.forEach(function(v,i){if(v&&!collected[i]){collected[i]=1;added++;}});
  saveCol();updateCollBtn();renderColl();$('codein').value='';
  $('codemsg').textContent=added?t('codeLoaded',{n:added}):t('codeNone');
});
document.addEventListener('keydown',function(e){
  if(anyOpen()){if(e.key==='Escape')closeM();return;}
  if(e.key>='1'&&e.key<='4')place(+e.key);
  else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0')place(0);
});

loadCol();start(makePuzzle(),true);applyLang();
})();
</script>
